<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Árboles (District Segment Test) - Sevilla</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Custom style tweaks for the district demo -->
    <style>
        .demo-badge {
            background-color: #3b82f6; /* Blue badge for district demo */
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            display: inline-block;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Sidebar / Control Panel -->
        <aside class="sidebar glass">
            <div class="sidebar-header">
                <h1>Árboles de Sevilla</h1>
                <p>Explora el inventario botánico de la ciudad</p>
                <span class="demo-badge">Segmentación por Distrito</span>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="district-filter">Seleccionar Distrito</label>
                    <select id="district-filter">
                        <!-- Populated dynamically via JS -->
                    </select>
                </div>

                <div class="control-group">
                    <label for="species-search">Filtrar por Especie</label>
                    <input type="text" id="species-search" placeholder="Ej: Citrus aurantium..." autocomplete="off">
                    <div id="autocomplete-list" class="autocomplete-items hidden"></div>
                    <div id="selected-species-tags" class="tags-container"></div>
                </div>

                <div class="control-group checkbox-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="living-only-filter" checked>
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label">Solo árboles vivos</span>
                </div>

                <div class="control-group checkbox-group">
                    <label class="toggle-switch">
                        <input type="checkbox" id="threatened-filter">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label">Solo especies amenazadas</span>
                </div>
            </div>
            
            <div class="stats-panel">
                <div class="stat-box">
                    <span class="stat-value" id="stat-total">-</span>
                    <span class="stat-label">Árboles Visibles</span>
                </div>
            </div>

            <div class="trees-list-container">
                <div id="visible-trees-list" class="trees-list"></div>
            </div>
            
            <div class="loader hidden" id="loader">
                <div class="spinner"></div>
                <p id="loader-text">Cargando datos...</p>
            </div>
        </aside>

        <!-- Map Container -->
        <main id="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Custom JS (District Segmented version) -->
    <script src="app-district.js"></script>
</body>
</html>
